---
- name: Add LINBIT repo
  yum_repository:
    name: drbd
    description: LINBIT Packages for LINSTOR and DRBD
    baseurl: "{{ linbit_repo_baseurl }}/yum/rhel{{ rhel_major_version }}/drbd-9/x86_64"
    gpgcheck: true
    gpgkey: https://packages.linbit.com/package-signing-pubkey.asc
  tags:
    - preload

- name: Add CI repo (disabled by default — only the linstor-gateway under test pulls from here)
  yum_repository:
    name: linbit-ci
    description: LINBIT CI Packages
    baseurl: "{{ ci_repo_baseurl }}"
    gpgcheck: false
    enabled: false
    metadata_expire: "0"
  tags:
    - preload

- name: Install resource-agents
  yum:
    pkg:
      - resource-agents
    enablerepo: drbd
  tags:
    - preload

- name: Install resource-agents helpers
  yum:
    pkg:
      - iptables
      - targetcli
  tags:
    - preload

- name: Install scst utils
  yum:
    pkg:
      - scstadmin
      - scst
    enablerepo: drbd
  tags:
    - preload

- name: Install kmod-scst
  yum:
    pkg:
      - "kmod-scst-*_{{ kernel_version | regex_replace('^(\\d+\\.\\d+.\\d+)-(.*)\\.el.*$', '\\1_\\2') }}*"
    enablerepo: drbd
  tags:
    - preload

- name: Configure automatic module loading
  copy:
    dest: /etc/modules-load.d/scst.conf
    content: |
      scst
      iscsi-scst
      scst_vdisk
  tags:
    - preload

- name: Enable iscsi-scst service
  service:
    name: iscsi-scst
    state: stopped
    enabled: yes
  tags:
    - preload

- name: Install nvme CLI
  yum:
    pkg:
      - nvme-cli
      - nvmetcli
  tags:
    - preload

- name: Install iSCSI initiator
  # Tests log in from a cluster node to verify the targets serve data.
  yum:
    pkg:
      - iscsi-initiator-utils
  tags:
    - preload

- name: Check nfs-ganesha source
  assert:
    that:
      - nfs_ganesha_source in ['linbit', 'ci']
      - nfs_ganesha_source != 'ci' or nfs_ganesha_version | length > 0
    fail_msg: >-
      nfs_ganesha_source must be 'linbit' or 'ci' (with a pinned
      nfs_ganesha_version), got '{{ nfs_ganesha_source }}' / '{{ nfs_ganesha_version }}'
  tags:
    - testimage

- name: Add nfs-ganesha CI repo (disabled by default)
  yum_repository:
    name: linbit-nfs-ganesha-ci
    description: LINBIT CI Packages (nfs-ganesha)
    baseurl: "{{ nfs_ganesha_ci_repo_url }}"
    gpgcheck: false
    enabled: false
    metadata_expire: "0"
  when: nfs_ganesha_source == 'ci'
  tags:
    - testimage

- name: Install nfs-ganesha
  yum:
    pkg:
      - "nfs-ganesha{{ ('-' + nfs_ganesha_version + '*') if nfs_ganesha_version | length > 0 else '' }}"
      - "nfs-ganesha-vfs{{ ('-' + nfs_ganesha_version + '*') if nfs_ganesha_version | length > 0 else '' }}"
    enablerepo: "{{ 'linbit-nfs-ganesha-ci' if nfs_ganesha_source == 'ci' else 'drbd' }}"
    update_cache: true
  # Bound the task: dnf has no aggressive timeout when a mirror is
  # unreachable, so without this a network issue would hang the pipeline
  # until the CI job timeout (~1h) instead of surfacing an error.
  async: 300
  poll: 5
  tags:
    - testimage

- name: Verify LINBIT nfs-ganesha is installed
  command: rpm -q --qf '%{VERSION}-%{RELEASE}\n' nfs-ganesha nfs-ganesha-vfs
  register: nfs_ganesha_installed
  changed_when: false
  failed_when: >-
    nfs_ganesha_installed.rc != 0 or
    nfs_ganesha_installed.stdout_lines | reject('search', '\.linbit-') | list | length > 0
  tags:
    - testimage

- name: Install LINSTOR Gateway from package
  yum:
    pkg:
      - "linstor-gateway-{{ linstor_gateway_version }}"
    enablerepo: linbit-ci
    update_cache: true
  register: linstor_gateway_install
  retries: 5
  until: linstor_gateway_install is success
  when: linstor_gateway_local_binary | length == 0
  tags:
    - testimage

- name: Install LINSTOR Gateway from local binary
  copy:
    src: "{{ linstor_gateway_local_binary }}"
    dest: /usr/sbin/linstor-gateway
    mode: '0755'
  when: linstor_gateway_local_binary | length > 0
  tags:
    - testimage

- name: Disable nfs server
  service:
    name: nfs-server
    state: stopped
    enabled: no
  tags:
    - preload

- name: Disable nfs-ganesha service
  service:
    name: nfs-ganesha
    state: stopped
    enabled: no
  tags:
    - testimage
